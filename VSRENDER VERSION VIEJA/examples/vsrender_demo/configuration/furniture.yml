items:
  vsrender:demo_chair:
    material: paper
    data:
      item_name: <!i>Silla de prueba VsRender
    model: vsrender:block/demo_chair
    behavior:
      type: block_item
      block:
        loot:
          pools:
          - rolls: 1
            entries:
            - type: item
              item: vsrender:demo_chair
        settings:
          hardness: 1.0
          resistance: 1.0
          is_suffocating: false
          is_redstone_conductor: false
          can_occlude: false
          propagate_skylight: true
          push_reaction: block
        events:
        - template: default:rotatable_block
        states:
          properties:
            facing:
              type: horizontal_direction
              default: north
          appearances:
            north:
              auto_state: leaves
              model:
                path: vsrender:block/demo_chair
                y: 0
            east:
              auto_state: leaves
              model:
                path: vsrender:block/demo_chair
                y: 90
            south:
              auto_state: leaves
              model:
                path: vsrender:block/demo_chair
                y: 180
            west:
              auto_state: leaves
              model:
                path: vsrender:block/demo_chair
                y: 270
          variants:
            facing=north:
              appearance: north
            facing=east:
              appearance: east
            facing=south:
              appearance: south
            facing=west:
              appearance: west
  vsrender:demo_lamp:
    material: paper
    data:
      item_name: <!i>Lámpara de prueba VsRender
    model: vsrender:block/demo_lamp_false
    behavior:
      type: block_item
      block:
        loot:
          pools:
          - rolls: 1
            entries:
            - type: item
              item: vsrender:demo_lamp
        settings:
          hardness: 1.0
          resistance: 1.0
          is_suffocating: false
          is_redstone_conductor: false
          can_occlude: false
          propagate_skylight: true
          push_reaction: block
        behaviors:
        - type: toggleable_lamp_block
          can_toggle_with_hand: true
        states:
          properties:
            lit:
              type: boolean
              default: false
          appearances:
            'false':
              auto_state: leaves
              model:
                path: vsrender:block/demo_lamp_false
                y: 0
            'true':
              auto_state: leaves
              model:
                path: vsrender:block/demo_lamp_true
                y: 0
          variants:
            lit=false:
              appearance: 'false'
              settings:
                luminance: 0
            lit=true:
              appearance: 'true'
              settings:
                luminance: 15
