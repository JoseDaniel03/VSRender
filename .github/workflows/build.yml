name: VSRender build checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dev_bundle:
        description: "Native26 Paper development bundle used for manual builds"
        required: true
        type: choice
        default: "26.3.build.+"
        options:
          - "26.3.build.+"
          - "26.2.build.123-stable"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Minecraft 26.3 migration tools
        run: |
          python3 -m py_compile porting/apply_26_3.py porting/audit_26_3.py
          python3 -m unittest discover -s porting -p 'test_*.py'

      - name: Detect imported module
        id: source
        shell: bash
        run: |
          if [[ -f core/src/main/java/net/momirealms/craftengine/core/plugin/Plugin.java ]] && [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source not imported yet; run the manual Import VSRender source workflow."
          fi

      - uses: actions/setup-java@v4
        if: steps.source.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Check private build dependency access
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_TOKEN: ${{ secrets.VSRENDER_SOURCE_TOKEN }}
        run: |
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Set VSRENDER_SOURCE_TOKEN to retrieve compile-only third-party dependencies."
            exit 1
          fi

      - name: Checkout temporary private build libraries
        if: steps.source.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: DaniDevz/VirgolandStudio
          ref: 88814227b8714cf30e9a82f8d756b18f9dfdd081
          token: ${{ secrets.VSRENDER_SOURCE_TOKEN }}
          sparse-checkout: |
            modules/vsrender-engine/libs
          sparse-checkout-cone-mode: true
          persist-credentials: false
          path: _private_build_libraries

      - name: Restore build libraries without committing them
        if: steps.source.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p libs
          cp _private_build_libraries/modules/vsrender-engine/libs/*.jar libs/
          test -f libs/leafpile-1.0.0.1.jar
          test -f libs/jni-internal-lookup-1.9.jar

      - name: Validate and package
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          VSRENDER_DEV_BUNDLE: ${{ inputs.dev_bundle || '26.2.build.123-stable' }}
        run: |
          chmod +x ./gradlew
          python3 porting/audit_26_3.py
          ./gradlew :core:test :bukkit:test :bukkit:compatibility:test :bukkit:native26:compileJava :bukkit:paper-loader:shadowJar "-PvsrenderPaperDevBundle=$VSRENDER_DEV_BUNDLE" --no-daemon --max-workers=2

      - name: Record build result
        if: steps.source.outputs.ready == 'true' && success()
        run: |
          test -n "$(find target -maxdepth 1 -name '*.jar' -print -quit)"
          echo "::notice::JAR built but not published until third-party licenses and Canvas 26.3 are validated."
