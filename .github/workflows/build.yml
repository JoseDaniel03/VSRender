name: VSRender build checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dev_bundle:
        description: "Native26 Paper development bundle used for compilation checks"
        required: true
        type: choice
        default: "26.3.build.+"
        options:
          - "26.3.build.+"
          - "26.2.build.123-stable"

# Keep at most one expensive Java 26.3 validation per branch.
# Older commits remain traceable in Actions with a cancelled status.
concurrency:
  group: vsrender-26-3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Minecraft 26.3 migration tools
        run: |
          python3 -m py_compile porting/apply_26_3.py porting/audit_26_3.py porting/verify_original.py
          python3 -m unittest discover -s porting -p 'test_*.py'

      - name: Validate web editor JavaScript syntax
        run: node --check bukkit/src/main/resources/vsrender-web/app.js

      - name: Report original source completeness
        run: python3 porting/verify_original.py

      - name: Detect imported module
        id: source
        shell: bash
        run: |
          if [[ -f core/src/main/java/net/momirealms/craftengine/core/plugin/Plugin.java ]] && [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source not imported yet; run the manual Import VSRender source workflow."
          fi

      - name: Enforce imported source and resource integrity
        if: steps.source.outputs.ready == 'true'
        run: python3 porting/verify_original.py --strict-source

      - uses: actions/setup-java@v4
        if: steps.source.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate resources without private JARs
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          VSRENDER_DEV_BUNDLE: ${{ inputs.dev_bundle || '26.3.build.+' }}
        run: |
          # Upstream Gradle build metadata reads git config user.name.
          git config --local user.name "VSRender CI"
          chmod +x ./gradlew
          ./gradlew :core:processResources :common-files:processResources "-PvsrenderPaperDevBundle=$VSRENDER_DEV_BUNDLE" --no-daemon --max-workers=2

      - name: Verify available original build libraries
        id: local_libraries
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while read -r path expected; do
            if [[ ! -f "$path" ]]; then
              echo "::notice::Build library not yet uploaded: $path"
              missing=$((missing + 1))
              continue
            fi
            actual="$(git hash-object -- "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unexpected build library hash: $path"
              exit 1
            fi
          done <<'EXPECTED_BLOBS'
          libs/AxiomPaperPlugin-5.0.4.jar 9c4010b991f4869a6bfa2e206cf4d0085a64fae2
          libs/denizen-1.3.3.jar 7d6e33134faa9223f71dd7d1a7e1b5255bd1321f
          libs/jni-internal-lookup-1.9.jar 20ac3feab182d43fa2b7359b4cfcb3fa300e25a3
          libs/leafpile-1.0.0.1.jar f1e531a52fc7c029a2964e8206e1b6158b785c88
          libs/worldguard-bukkit-7.0.14-dist.jar 69d590e5e84439b9316fb76c582a3db59e1808bd
          bukkit/compatibility/legacy/libs/awsm-api.jar d5d4d7c4c100edecc6e53f5de0e81683b01a5b0b
          bukkit/compatibility/legacy/libs/flow-nbt-2.0.2.jar 68c47da2ad3cd1ec86930bfda37ea8f7112da5d0
          EXPECTED_BLOBS
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [[ "$missing" == 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect optional private compile dependencies
        id: private_deps
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_TOKEN: ${{ secrets.VSRENDER_SOURCE_TOKEN }}
        run: |
          if [[ "${{ steps.local_libraries.outputs.available }}" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "restore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::All seven original build libraries are present and hash-verified."
          elif [[ -n "$SOURCE_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "restore=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing libraries will be restored from the pinned private source."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "restore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Partial Core checks run with available libraries; full Java compile requires two missing legacy JARs."
          fi

      - name: Probe Core tests with available libraries (no plugin JAR)
        if: steps.source.outputs.ready == 'true' && steps.private_deps.outputs.available != 'true'
        id: core_probe
        continue-on-error: true
        shell: bash
        env:
          VSRENDER_DEV_BUNDLE: ${{ inputs.dev_bundle || '26.3.build.+' }}
        run: |
          ./gradlew :core:test "-PvsrenderPaperDevBundle=$VSRENDER_DEV_BUNDLE" --no-daemon --max-workers=2

      - name: Explain incomplete partial Core tests
        if: steps.source.outputs.ready == 'true' && steps.private_deps.outputs.available != 'true' && steps.core_probe.outcome == 'failure'
        run: |
          echo "::warning::Partial Core compile or tests failed; inspect errors. Full server/NMS validation remains pending."

      - name: Checkout temporary private build libraries
        if: steps.private_deps.outputs.restore == 'true'
        uses: actions/checkout@v4
        with:
          repository: DaniDevz/VirgolandStudio
          ref: 88814227b8714cf30e9a82f8d756b18f9dfdd081
          token: ${{ secrets.VSRENDER_SOURCE_TOKEN }}
          sparse-checkout: |
            modules/vsrender-engine/libs
            modules/vsrender-engine/bukkit/compatibility/legacy/libs
          sparse-checkout-cone-mode: true
          persist-credentials: false
          path: _private_build_libraries

      - name: Restore missing original build libraries without committing them
        if: steps.private_deps.outputs.restore == 'true'
        run: |
          set -euo pipefail
          mkdir -p libs
          for jar in _private_build_libraries/modules/vsrender-engine/libs/*.jar; do
            target="libs/${jar##*/}"
            [[ -f "$target" ]] || cp "$jar" "$target"
          done
          mkdir -p bukkit/compatibility/legacy/libs
          for jar in _private_build_libraries/modules/vsrender-engine/bukkit/compatibility/legacy/libs/*.jar; do
            target="bukkit/compatibility/legacy/libs/${jar##*/}"
            [[ -f "$target" ]] || cp "$jar" "$target"
          done
          test -f bukkit/compatibility/legacy/libs/awsm-api.jar
          test -f bukkit/compatibility/legacy/libs/flow-nbt-2.0.2.jar
          test -f libs/leafpile-1.0.0.1.jar
          test -f libs/jni-internal-lookup-1.9.jar
          # Compile-only inputs must be byte-for-byte identical to the pinned upstream.
          while IFS=' ' read -r path expected; do
            [[ -n "$path" ]] || continue
            actual="$(git hash-object -- "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unverified third-party build dependency: $path"
              exit 1
            fi
          done <<'EXPECTED_BLOBS'
          libs/AxiomPaperPlugin-5.0.4.jar 9c4010b991f4869a6bfa2e206cf4d0085a64fae2
          libs/denizen-1.3.3.jar 7d6e33134faa9223f71dd7d1a7e1b5255bd1321f
          libs/jni-internal-lookup-1.9.jar 20ac3feab182d43fa2b7359b4cfcb3fa300e25a3
          libs/leafpile-1.0.0.1.jar f1e531a52fc7c029a2964e8206e1b6158b785c88
          libs/worldguard-bukkit-7.0.14-dist.jar 69d590e5e84439b9316fb76c582a3db59e1808bd
          bukkit/compatibility/legacy/libs/awsm-api.jar d5d4d7c4c100edecc6e53f5de0e81683b01a5b0b
          bukkit/compatibility/legacy/libs/flow-nbt-2.0.2.jar 68c47da2ad3cd1ec86930bfda37ea8f7112da5d0
          EXPECTED_BLOBS

      - name: Compile and test (no plugin JAR)
        if: steps.private_deps.outputs.available == 'true'
        shell: bash
        env:
          VSRENDER_DEV_BUNDLE: ${{ inputs.dev_bundle || '26.3.build.+' }}
        run: |
          chmod +x ./gradlew
          python3 porting/audit_26_3.py
          ./gradlew :extensions:vscontenido-mechanics:test :core:test :bukkit:test :bukkit:compatibility:test :bukkit:native26:compileJava :bukkit:paper-loader:compileJava "-PvsrenderPaperDevBundle=$VSRENDER_DEV_BUNDLE" --no-daemon --max-workers=2

      - name: Show Bukkit test failure details
        if: failure()
        shell: bash
        run: |
          if [[ -d bukkit/build/test-results/test ]]; then
            grep -h -A 22 '<failure' bukkit/build/test-results/test/TEST-*.xml | head -n 180 || true
          fi

      - name: Assemble VSRender 26.3 Paper plugin JAR
        if: steps.source.outputs.ready == 'true' && steps.private_deps.outputs.available == 'true'
        shell: bash
        env:
          VSRENDER_DEV_BUNDLE: ${{ inputs.dev_bundle || '26.3.build.+' }}
        run: |
          set -euo pipefail
          ./gradlew :bukkit:paper-loader:shadowJar "-PvsrenderPaperDevBundle=$VSRENDER_DEV_BUNDLE" --no-daemon --max-workers=2
          shopt -s nullglob
          jars=(target/vsrender-paper-plugin-*.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one VSRender Paper plugin JAR; found ${#jars[@]}"
            exit 1
          fi
          jar tf "${jars[0]}" | grep -qx 'paper-plugin.yml'
          unzip -t "${jars[0]}" >/dev/null
          sha256sum "${jars[0]}"
          du -h "${jars[0]}"

      - name: Upload VSRender 26.3 plugin JAR
        if: steps.source.outputs.ready == 'true' && steps.private_deps.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VSRender-26.3-Paper-plugin
          path: target/vsrender-paper-plugin-*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record migration validation result
        if: steps.source.outputs.ready == 'true' && success()
        run: |
          echo "::notice::Upstream source integrity verified; compiled VSRender Paper plugin JAR uploaded when all build inputs are available. Runtime validation on VSEngine 26.3 remains pending."
