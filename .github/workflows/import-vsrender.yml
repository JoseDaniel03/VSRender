name: Import VSRender source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source credential
        env:
          SOURCE_TOKEN: ${{ secrets.VSRENDER_SOURCE_TOKEN }}
        run: |
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Falta el secreto VSRENDER_SOURCE_TOKEN con Contents: Read en DaniDevz/VirgolandStudio."
            exit 1
          fi

      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout original private repository (read only)
        uses: actions/checkout@v4
        with:
          repository: DaniDevz/VirgolandStudio
          ref: 88814227b8714cf30e9a82f8d756b18f9dfdd081
          token: ${{ secrets.VSRENDER_SOURCE_TOKEN }}
          sparse-checkout: |
            modules/vsrender-engine
          sparse-checkout-cone-mode: true
          path: _upstream
          persist-credentials: false

      - name: Copy original standalone module
        run: |
          set -euo pipefail
          test -f _upstream/modules/vsrender-engine/settings.gradle.kts
          test -f _upstream/modules/vsrender-engine/LICENSE
          rsync -a --exclude '/README.md' --exclude '/.gitmodules' \
            _upstream/modules/vsrender-engine/ ./
          test -d core/src/main/java
          test -f LICENSE
          test -f settings.gradle.kts

      - name: Commit original sources on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- . ':!_upstream'
          if git diff --cached --quiet; then
            echo "VSRender source is already imported."
            exit 0
          fi
          git commit -m "port: import VSRender engine from VirgolandStudio at 88814227"
          git push origin HEAD:main
