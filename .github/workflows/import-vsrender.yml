# The one-time private source import has finished.
# Keep this workflow path for provenance, but never re-import pinned 2026
# sources onto newer independently maintained VSRender files.
name: VSRender migration completeness audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VSRender
        uses: actions/checkout@v4

      - name: Verify migrated source and original metadata
        run: |
          python3 -m unittest discover -s porting -p 'test_*.py'
          python3 porting/verify_original.py --strict-source

      - name: Record migration milestone
        run: |
          echo "::notice::Full source-tree migration audited. Seven non-redistributable third-party JARs remain external; this job never builds or publishes a plugin JAR."
